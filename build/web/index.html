<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/MathMitra/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MathMitra — every Maths formula with meaning, symbols and a solved example.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MathMitra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MathMitra — Maths Formula Book</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #2A1A5E, #4338CA 55%, #7C3AED);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      font-family: Arial, Helvetica, sans-serif;
    }
    #splash .logo { color: #fff; font-size: 34px; font-weight: 700; letter-spacing: .5px; }
    #splash .sub { color: rgba(255,255,255,.75); font-size: 14px; margin-top: -10px; }
    #splash .icon { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 14px 34px rgba(0,0,0,.35); }
    #splash .syms { display: flex; gap: 15px; margin-top: 4px; }
    #splash .syms span {
      font-family: Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 700;
      color: #E7E3FF; display: inline-block; animation: mmbounce 1.3s ease-in-out infinite;
    }
    @keyframes mmbounce {
      0%, 100% { transform: translateY(0); opacity: .4; }
      50% { transform: translateY(-11px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img class="icon" src="icons/Icon-192.png" alt="MathMitra">
    <div class="logo">MathMitra</div>
    <div class="sub">Maths Formula Book</div>
    <div class="syms"><span style="animation-delay:0s">&#8747;</span><span style="animation-delay:.13s">&#960;</span><span style="animation-delay:.26s">&#8730;</span><span style="animation-delay:.39s">&#8721;</span><span style="animation-delay:.52s">&#8734;</span><span style="animation-delay:.65s">x&#178;</span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
