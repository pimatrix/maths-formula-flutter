# Builds the release APK and publishes it to the apk-latest GitHub release.
name: Build MathMitra APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Prefer Google's Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-mirror.gradle" << 'GRADLE'
          // Maven Central's own CDN redirects a few large artifacts (e.g. the
          // Kotlin compiler) to GitHub releases, which intermittently time out
          // (HTTP 504). Google's mirror serves the same artifacts directly.
          // NOTE: inject ONLY into settings-level dependency resolution.
          // Injecting pluginManagement or project repositories conflicts with
          // Flutter's settings (RepositoriesMode) and breaks plugin loading.
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2'
          beforeSettings { settings ->
              settings.dependencyResolutionManagement {
                  repositories {
                      maven { url mirror }
                  }
              }
          }
          GRADLE

      - name: Restore release signing key (when configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/mathmitra-upload.p12
            cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=mathmitra
          storeFile=mathmitra-upload.p12
          EOF
            echo "Release signing key restored."
          else
            echo "No signing key configured; falling back to debug signing."
          fi

      - name: Build release APK (up to 3 attempts)
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if flutter build apk --release; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "All build attempts failed"
          exit 1

      - name: Publish APK to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MathMitra APK (latest)
          body: Latest MathMitra Android APK, built automatically from the main branch. Download app-release.apk and install it on your phone (you may need to allow installs from your browser once).
          files: build/app/outputs/flutter-apk/app-release.apk
