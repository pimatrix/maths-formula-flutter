# Builds the release APK and publishes it to the apk-latest GitHub release.
name: Build MathMitra APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MathMitra APK (latest)
          body: Latest MathMitra Android APK, built automatically from the main branch. Download app-release.apk and install it on your phone (you may need to allow installs from your browser once).
          files: build/app/outputs/flutter-apk/app-release.apk
