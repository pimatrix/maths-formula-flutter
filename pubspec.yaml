name: maths_formula_sheet
description: MathMitra — Maths formulas with meaning, symbols and solved examples.
publish_to: "none"
version: 1.2.1+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.0
  battery_plus: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/formulas-seed.json
    - assets/icon.png
    - assets/formula-details.json
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/Inter-400.ttf
    - assets/fonts/Inter-700.ttf
    - assets/fonts/SpaceGrotesk-700.ttf
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
